<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct hit or refresh on a route like
      // /twitch-clip-viewer/tools 404s here instead of reaching the SPA. Stash the intended
      // path and bounce to index.html, which restores it via history.replaceState before
      // the app decides what to render (see the inline script in index.html).
      sessionStorage.setItem('spa-redirect-path', location.pathname + location.search + location.hash);
      location.replace('/twitch-clip-viewer/');
    </script>
  </head>
  <body></body>
</html>
